<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyWolf TV Player</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/player.css" />
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('mywolftv.active');
        if (raw) {
          const a = JSON.parse(raw);
          const host = a && (a.host || a.url);
          if (host) {
            const u = new URL(host);
            const l = document.createElement('link');
            l.rel = 'preconnect';
            l.href = u.protocol + '//' + u.host;
            document.head.appendChild(l);
            const d = document.createElement('link');
            d.rel = 'dns-prefetch';
            d.href = l.href;
            document.head.appendChild(d);
          }
        }
      } catch (e) {}
    })();
  </script>
  <script src="js/vendor/hls.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js';document.head.appendChild(s);"></script>
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.svg" alt="MyWolf TV" />
      <div>
        <div class="sidebar-title">MyWolf <span>TV</span></div>
        <div class="sidebar-sub" id="playlist-name">Playlist</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="live">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7v2H7v2h10v-2h-3v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/></svg>
        <span>Live TV</span>
      </button>
      <button class="nav-item" data-view="movies">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4v1h-2V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v1H6V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v16a2 2 0 0 0 2 2 2 2 0 0 0 2-2v-1h2v1a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-1h2v1a2 2 0 0 0 2 2 2 2 0 0 0 2-2V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
        <span>Movies</span>
      </button>
      <button class="nav-item" data-view="series">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        <span>Series</span>
      </button>
      <button class="nav-item" data-view="favorites">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Favorites</span>
      </button>
      <button class="nav-item" data-view="recent">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm-1 5v5l4.25 2.52.75-1.23-3.5-2.08V8H12zM15 3v2h4V3h-4zm4 4v2h2V7h-2z"/></svg>
        <span>Recent</span>
      </button>
      <button class="nav-item" data-view="search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <span>Search</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button id="logout-btn" class="btn-ghost">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="view-title">Live TV</div>
      <div class="topbar-actions">
        <input type="search" id="category-search" placeholder="Filter channels..." class="topbar-search" />
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <div class="content">
      <aside class="categories" id="categories">
        <div class="category-header">Categories</div>
        <div class="category-list" id="category-list"></div>
      </aside>

      <section class="items-panel" id="items-panel">
        <div class="items-grid" id="items-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <img src="assets/logo.svg" alt="" />
          <p>Loading playlist...</p>
        </div>
      </section>
    </div>
  </main>

  <div id="player-modal" class="player-modal" hidden>
    <div class="player-modal-inner">
      <div class="player-header">
        <div class="player-info">
          <img id="player-logo" src="" alt="" onerror="this.style.display='none'" />
          <div>
            <div id="player-title" class="player-title">Channel</div>
            <div id="player-program" class="player-program"></div>
          </div>
        </div>
        <div class="player-actions">
          <button id="player-audio" class="icon-btn" title="Audio track" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </button>
          <button id="player-subs" class="icon-btn" title="Subtitles" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM4 12h4v2H4v-2zm10 6H4v-2h10v2zm6 0h-4v-2h4v2zm0-4H10v-2h10v2z"/></svg>
          </button>
          <button id="player-quality" class="icon-btn" title="Quality" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.39 7.36H22l-6.2 4.5 2.39 7.36L12 16.72l-6.2 4.5 2.39-7.36L2 9.36h7.61z"/></svg>
          </button>
          <button id="player-rate" class="icon-btn" title="Speed" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05c-5.05.5-9 4.76-9 9.95 0 5.52 4.48 10 9.99 10 3.31 0 6.24-1.62 8.06-4.09l-2.6-1.53C16.17 17.98 14.21 19 12 19z"/></svg>
          </button>
          <button id="player-aspect" class="icon-btn" title="Aspect ratio">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h3V4H2v5h2V6zm0 12v-3H2v5h5v-2H4zm16-12h-3V4h5v5h-2V6zm0 12h-3v2h5v-5h-2v3z"/></svg>
          </button>
          <button id="player-fav" class="icon-btn" title="Favorite">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </button>
          <button id="player-close" class="icon-btn" title="Close">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
      </div>
      <video id="video" controls playsinline></video>
      <div id="player-menu" class="player-menu" hidden></div>
      <div id="epg-panel" class="epg-panel"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/xtream.js"></script>
  <script src="js/m3u.js"></script>
  <script src="js/pair.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tv-nav.js"></script>
</body>
</html>
